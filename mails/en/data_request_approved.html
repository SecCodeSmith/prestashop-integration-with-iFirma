<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoice data change approved</title>
</head>
<body style="margin:0;padding:0;background:#f1f1f1;font-family:Open-sans,sans-serif;font-size:14px;color:#555454;">
<table style="width:100%;background:#f1f1f1;" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:20px 0;">
<table style="width:600px;max-width:100%;background:#ffffff;" cellpadding="0" cellspacing="0">
<tr><td style="padding:20px;background:#fbfbfb;border-bottom:1px solid #d6d4d4;font-size:18px;color:#333333;"><a href="{ifirma_shop_link}" style="color:#333333;text-decoration:none;"><img src="{shop_logo}" alt="{shop_name}" style="max-height:60px;vertical-align:middle;border:0;"> {shop_name}</a></td></tr>
<tr><td style="padding:20px;">
<p>Hello {firstname},</p>
<p>Your request to change the invoice data of order <strong>{order_reference}</strong> has been approved. The document will be issued with the following data:</p>
<div style="white-space:pre-line;margin:0;padding:8px;background:#f5f5f5;border:1px solid #ddd">{approved_data}</div>
<p>{reason}</p>
</td></tr>
<tr><td style="padding:12px 20px;background:#fbfbfb;border-top:1px solid #d6d4d4;font-size:12px;color:#777777;"><a href="{ifirma_shop_link}" style="color:#777777;">{ifirma_shop_link}</a></td></tr>
</table>
</td></tr></table>
</body>
</html>
