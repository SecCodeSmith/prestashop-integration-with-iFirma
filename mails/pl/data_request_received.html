<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Prosba o zmiane danych do faktury</title></head>
<body style="font-family:Arial,sans-serif;font-size:14px;color:#333">
<p>Klient poprosil o zmiane danych do dokumentu dla zamowienia <strong>{order_reference}</strong> (#{order_id}).</p>
<p>Klient: {customer_name} ({customer_email})</p>
<h3>Zadane dane</h3>
<div style="white-space:pre-line;margin:0;padding:8px;background:#f5f5f5;border:1px solid #ddd">{requested_data}</div>
<h3>Roznice wzgledem aktualnego adresu rozliczeniowego</h3>
<div style="white-space:pre-line;margin:0;padding:8px;background:#f5f5f5;border:1px solid #ddd">{diff}</div>
<h3>Uwagi klienta</h3>
<div style="white-space:pre-line;margin:0;padding:8px;background:#f5f5f5;border:1px solid #ddd">{note}</div>
<p>Rozpatrz prosbe w zamowieniu: <a href="{admin_link}">{admin_link}</a></p>

</body>
</html>
