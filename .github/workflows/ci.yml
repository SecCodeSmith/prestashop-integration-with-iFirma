name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The commit every job checks out, tests and builds, and the one the test build's
  # ifirma/BUILD names: the PR head on pull_request runs (not GitHub's synthetic
  # merge commit), otherwise the pushed or dispatched commit.
  IFIRMA_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lint:
    name: PHP lint & license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IFIRMA_BUILD_COMMIT }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: PHP syntax check
        run: git ls-files '*.php' | while read -r f; do php -l "$f"; done
      - name: Verify license headers
        run: python3 tools/check_license_headers.py

  lint-php72:
    name: PHP 7.2 syntax (shipped code)
    # The module declares php >=7.2. Tests and dev tools are left out: the tests need
    # PHPUnit 9, so PHP 7.3+.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IFIRMA_BUILD_COMMIT }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.2"
          coverage: none
      - name: PHP 7.2 syntax check
        run: git ls-files '*.php' ':!:tests/' ':!:tools/' | while read -r f; do php -l "$f"; done

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    # The module must live in a folder named "ifirma" (as PrestaShop installs it); the
    # test bootstrap resolves _PS_MODULE_DIR_ from that folder name.
    defaults:
      run:
        working-directory: ifirma
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IFIRMA_BUILD_COMMIT }}
          path: ifirma
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run unit tests
        run: tests/vendor/bin/phpunit

  coverage:
    name: Changed-line coverage
    # Every changed PHP line must be covered by a test. A pull request compares with its
    # base, a push with the commit before the push, a manual run with master.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ifirma
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IFIRMA_BUILD_COMMIT }}
          path: ifirma
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: pcov
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          pip install diff-cover
      - name: Run unit tests with coverage
        run: composer coverage
      - name: Require 100% coverage of changed lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/master' }}
        run: |
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=origin/master; fi
          diff-cover build/coverage.xml --compare-branch="$BASE" --fail-under=100

  build:
    name: Test build (zip + tgz)
    # A test build is only produced from a tree that passed every check.
    needs: [lint, lint-php72, phpunit, coverage, mock]
    runs-on: ubuntu-latest
    env:
      # Build identity lives only in the zip name and ifirma/BUILD; the module
      # version (ifirma.php / config.xml) is never changed by a test build.
      IFIRMA_BUILD_CHANNEL: test
      IFIRMA_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IFIRMA_BUILD_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build installable zip and npm tarball
        run: npm run build
      - name: Verify package layout and BUILD manifest
        run: npm run verify:package -- --channel test
      - name: Resolve artifact name
        id: meta
        run: echo "name=ifirma-$(node -p "require('./package.json').version")+build.${IFIRMA_BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            dist/*.zip
            *.tgz
          retention-days: 90
          if-no-files-found: error

  mock:
    name: Mock tests (test-stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IFIRMA_BUILD_COMMIT }}
          # test-stack is a public git submodule (github.com/SecCodeSmith/test-stack).
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require the test-stack submodule
        run: |
          if [ ! -f test-stack/ifirma-mock/requirements-dev.txt ]; then
            echo "::error::test-stack submodule is missing: it must be registered in .gitmodules and checked out (actions/checkout submodules: true)"
            exit 1
          fi
      - name: Install mock dependencies
        working-directory: test-stack/ifirma-mock
        run: pip install -r requirements-dev.txt
      - name: Run mock tests
        working-directory: test-stack/ifirma-mock
        # pyproject.toml already sets -q; another -q would hide the pass count.
        run: pytest
      - name: Verify mock licence headers
        run: python3 test-stack/tools/check_license_headers.py
