<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Invoice data change request</title></head>
<body style="font-family:Arial,sans-serif;font-size:14px;color:#333">
<p>A customer asked to change the invoice data of order <strong>{order_reference}</strong> (#{order_id}).</p>
<p>Customer: {customer_name} ({customer_email})</p>
<h3>Requested data</h3>
<div style="white-space:pre-line;margin:0;padding:8px;background:#f5f5f5;border:1px solid #ddd">{requested_data}</div>
<h3>Differences vs the current invoice address</h3>
<div style="white-space:pre-line;margin:0;padding:8px;background:#f5f5f5;border:1px solid #ddd">{diff}</div>
<h3>Customer note</h3>
<div style="white-space:pre-line;margin:0;padding:8px;background:#f5f5f5;border:1px solid #ddd">{note}</div>
<p>Review the request in the order: <a href="{admin_link}">{admin_link}</a></p>

</body>
</html>
