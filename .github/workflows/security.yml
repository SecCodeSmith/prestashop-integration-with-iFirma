name: Security

# Vulnerability hunting: dependency advisories (PHP, Node, Python), dependency review on pull
# requests, committed secrets, insecure PHP patterns, container image tags and configuration.
# Runs on every pull request, on pushes to the default branch and weekly, so a new advisory
# against unchanged code is found too. A high or critical finding fails the run. There is no
# ignore file: an accepted risk is written down with its reason and an expiry date in
# docs/development.md ("Security scanning"), never silenced here.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-audit:
    name: Composer audit (PHP dev tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - run: composer audit --locked

  npm-audit:
    name: npm audit (build scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm audit --audit-level=moderate

  pip-audit:
    name: pip-audit (mock helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit==2.10.1
      - name: Audit the mock requirements, transitive packages included
        run: pip-audit -r test-stack/ifirma-mock/requirements-dev.txt

  dependency-review:
    name: Dependency review (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  secrets:
    name: Secret scan (tree and history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The image is pinned by tag; --redact keeps a finding's value out of the log.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 \
            detect --source /repo --redact --no-banner --exit-code 1

  licences:
    name: Dependency licences (no GPL in what ships)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r test-stack/ifirma-mock/requirements-dev.txt
      - run: python3 tools/check_dependency_licenses.py

  semgrep:
    name: Semgrep (PHP and secrets rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install semgrep==1.184.0
      - name: Scan the shipped PHP
        run: |
          semgrep scan --config p/php --config p/secrets --severity ERROR --error --metrics=off \
            ifirma.php classes controllers views mails sql upgrade

  trivy:
    name: Trivy (repository, configuration, images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Pinned container images
        run: python3 tools/check_pinned_images.py test-stack
      - name: Vulnerabilities, secrets and misconfiguration in the repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          # test-stack is its own repository (git submodule) and never ships; it is reported below.
          skip-dirs: node_modules,tests/vendor,graphify-out,test-stack
          exit-code: "1"
      - name: Test-stack configuration and images (report only, they never ship with the module)
        run: |
          docker run --rm -v "$PWD/test-stack:/repo" aquasec/trivy:0.58.0 config --severity HIGH,CRITICAL /repo || true
          for image in mariadb:11.4 prestashop/prestashop:9.1.4-apache python:3.12-slim; do
            docker run --rm aquasec/trivy:0.58.0 image --severity HIGH,CRITICAL --no-progress "$image" || true
          done
