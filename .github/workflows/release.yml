name: Release

# Manual release, atomic up to the publish step:
#   1. verify  - PHPUnit, PHP lint and licence headers on the commit being released
#   2. bump    - `npm version` syncs package.json, ifirma.php and config.xml and
#                creates the release commit + tag LOCALLY (nothing pushed yet)
#   3. build   - release zip (BUILD channel "release") + npm tarball, verified, then
#                kept as the run's "release-files" artifact
#   4. push    - commit and tag reach the remote only after 1-3 succeeded, in one
#                atomic push: if the remote refuses either ref, neither lands
#   5. publish - GitHub Release with the zip and tarball attached
#   6. CI      - start ci.yml on the new tag: pushes made with GITHUB_TOKEN do not
#                trigger workflows, but workflow_dispatch does, so the release
#                commit still gets its own CI run and test build
# If step 5 fails the tag exists without a release: unpack the run's "release-files"
# artifact and, in that folder, run `gh release create v<version> --title v<version>
# --generate-notes dist/ifirma-<version>.zip scm-ifirma-<version>.tgz` (see README).
# If only step 6 fails, start CI by hand: Actions -> CI -> Run workflow on tag v<version>.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  actions: write # step 6 dispatches ci.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The test bootstrap resolves _PS_MODULE_DIR_ from the folder name, so the
    # module is checked out into "ifirma" exactly as in the CI phpunit job.
    defaults:
      run:
        working-directory: ifirma
    steps:
      - uses: actions/checkout@v4
        with:
          path: ifirma
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ifirma/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-interaction --prefer-dist

      - name: Verify before releasing (PHPUnit, lint, licence headers)
        run: |
          tests/vendor/bin/phpunit
          git ls-files '*.php' | while read -r f; do php -l "$f"; done
          python3 tools/check_license_headers.py

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, sync files, commit & tag (local only)
        run: |
          npm version ${{ inputs.bump }} -m "release: v%s"

      - name: Build and verify release artifacts (zip + tgz)
        env:
          IFIRMA_BUILD_CHANNEL: release
        run: |
          npm run build
          npm run verify:package -- --channel release

      - name: Keep the verified release files
        # The exact files the release publishes, so a failed publish step can be
        # finished by hand with the same bytes.
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            ifirma/dist/*.zip
            ifirma/*.tgz
          retention-days: 90
          if-no-files-found: error

      - name: Push commit and tag
        # --atomic: the branch and the tag land together or not at all.
        run: git push --atomic --follow-tags

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            ./dist/*.zip ./*.tgz

      - name: Start CI for the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh workflow run ci.yml --ref "$VERSION"
          echo "Started CI on $VERSION"
